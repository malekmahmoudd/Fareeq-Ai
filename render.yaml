# Backend only. PostgreSQL lives on Neon Free; frontend lives on Netlify Free.
services:
  - type: web
    name: fareeqai-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: hardening/quality-auth-deploy
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/detail
    autoDeployTrigger: off
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTH_REQUIRED
        value: "true"
      - key: SIGNUP_ENABLED
        value: "false"
      - key: PUSH_ENABLED
        value: "false"
      - key: VOICE_ENABLED
        value: "false"
      - key: TTS_ENABLED
        value: "false"
      - key: TEAM_ENABLED
        value: "false"
      - key: ACCOUNT_REQUESTS_PER_MINUTE
        value: "6"
      - key: ACCOUNT_DAILY_TOKEN_BUDGET
        value: "60000"
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_ACCESS_KEYS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_TIMEOUT_SECONDS
        value: "35"
      - key: MEMORY_TIMEOUT_SECONDS
        value: "8"
      - key: MEMORY_EXTRACTION
        value: auto
